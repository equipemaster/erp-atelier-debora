<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <link rel="icon" href="favicon-16x16.png" type="favicon-16x16.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Ateliê Débora Freitas</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDQr7d8DVtzWPPSIAYo1cQg9Swc8IETT3I",
      authDomain: "erp-atelier-debora.firebaseapp.com",
      projectId: "erp-atelier-debora",
      appId: "1:1234567890:web:321abc456def7890"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    async function login(email, senha) {
      try {
        await auth.signInWithEmailAndPassword(email, senha);
        window.location = 'home.html';
      } catch (e) {
        alert('Erro no login: ' + e.message);
      }
    }
  </script>
  <style>
    body {
      font-family: 'Helvetica', serif;
      background: #0d2d0e;
      color: #333;
      text-align: center;
      padding-top: 100px;
    }
    input {
      display: block;
      margin: 10px auto;
      padding: 10px;
      width: 250px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      background: #c7a17a;
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Ateliê Débora Freitas</h1>
  <h2>Login</h2>
  <input type="email" id="email" placeholder="Email" />
  <input type="password" id="senha" placeholder="Senha" />
  <button onclick="login(document.getElementById('email').value, document.getElementById('senha').value)">Entrar</button>
<footer>
    &copy; 2025 Ateliê Débora Freitas. Todos os direitos reservados.
  </footer>
</body>
</html>
