<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Ateliê Débora Freitas</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  
  <style>
    body {
      background-color: black;
      color: white;
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    .logo {
      width: 400px;
      height: 100px;
      display: block;
      margin-bottom: 20px;
      object-fit: cover;
    }

    .login-box {
      text-align: center;
    }

    input {
      display: block;
      width: 250px;
      margin: 10px auto;
      padding: 10px;
      border-radius: 5px;
      border: none;
    }

    button {
      background-color: #c59d66;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      width: 270px;
    }

    footer {
      margin-top: 20px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <img src="logo.jpeg" alt="Logo DF" class="logo">
  <div class="login-box">
  <form id="loginForm">
    <h2>Login</h2>
    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="senha" placeholder="Senha" required>
    <button type="submit">Entrar</button>
  </form>
    </div>
    <footer>
      © 2025 Ateliê Débora Freitas. Todos os direitos reservados.
    </footer>
  </div>

<script>
    const firebaseConfig = {
  apiKey: "AIzaSyDHWdwZ-SyOZjvUv9blUv1m70m5CvaOs8o",
  authDomain: "erp-ateliedebora-275e7.firebaseapp.com",
  databaseURL: "https://erp-ateliedebora-275e7-default-rtdb.firebaseio.com",
  projectId: "erp-ateliedebora-275e7",
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    console.log(auth)
     // Função de login com Firebase Auth (já existente)
    async function login(email, senha) {
      try {
        await auth.signInWithEmailAndPassword(email, senha);
        window.location = 'home.html';
      } catch (e) {
        alert('Erro no login: ' + e.message);
      }
    }

    // Captura o evento de envio do formulário
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', function(event) {
      event.preventDefault(); // Impede envio padrão
      const email = form.email.value;
      const senha = form.senha.value;
      login(email, senha); // Chama sua função
    });
  </script>

</body>
</html>
