<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <link rel="icon" href="android-chrome-192x192.png" type="android-chrome-192x192.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Ateliê Débora Freitas</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
     apiKey: "AIzaSyDHWdwZ-SyOZjvUv9blUv1m70m5CvaOs8o",
  authDomain: "erp-ateliedebora-275e7.firebaseapp.com",
  projectId: "erp-ateliedebora-275e7",
  storageBucket: "erp-ateliedebora-275e7.firebasestorage.app",
  messagingSenderId: "375960061963",
  appId: "1:375960061963:web:ca29e2881ad03c3a2b1f0e",
  measurementId: "G-ZTCE581F5W"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    async function login(email, senha) {
      try {
        await auth.signInWithEmailAndPassword(email, senha);
        window.location = 'home.html';
      } catch (e) {
        alert('Erro no login: ' + e.message);
      }
    }
  </script>
  <style>
     body {
      background-color: black;
      color: white;
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    .logo {
      width: 400px;
      height: auto;
      display: block;
      margin-bottom: 20px;
    }

    .login-box {
      text-align: center;
    }

    input {
      display: block;
      width: 250px;
      margin: 10px auto;
      padding: 10px;
      border-radius: 5px;
      border: none;
    }

    button {
      background-color: #c59d66;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      width: 270px;
    }

    footer {
      margin-top: 20px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <img src="logo.jpeg" alt="Logo DF" class="logo">

  <div class="login-box">
    <h2>Login</h2>
    <input type="email" placeholder="Email">
    <input type="password" placeholder="Senha">
    <button>Entrar</button>
  </div>
    
    <footer>

</body>
