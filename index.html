<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <link rel="icon" href="android-chrome-192x192.png" type="android-chrome-192x192.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Ateliê Débora Freitas</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script>
    const firebaseConfig = {
     apiKey: "AIzaSyDHWdwZ-SyOZjvUv9blUv1m70m5CvaOs8o",
  authDomain: "erp-ateliedebora-275e7.firebaseapp.com",
  projectId: "erp-ateliedebora-275e7",
  storageBucket: "erp-ateliedebora-275e7.firebasestorage.app",
  messagingSenderId: "375960061963",
  appId: "1:375960061963:web:ca29e2881ad03c3a2b1f0e",
  measurementId: "G-ZTCE581F5W"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    async function login(email, senha) {
      try {
        await auth.signInWithEmailAndPassword(email, senha);
        window.location = 'home.html';
      } catch (e) {
        alert('Erro no login: ' + e.message);
      }
    }
  </script>
  <style>
    body {
      font-family: 'Outfit', Outfit;
      background: #000000;
      color: #333;
      text-align: center;
      padding-top: 100px;
    }
    input {
      display: block;
      margin: 10px auto;
      padding: 10px;
      width: 250px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      background: #c7a17a;
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Ateliê Débora Freitas</h1>
  <h2>Login</h2>
  <input type="email" id="email" placeholder="Email" />
  <input type="password" id="senha" placeholder="Senha" />
  <button onclick="login(document.getElementById('email').value, document.getElementById('senha').value)">Entrar</button>
<footer>
    &copy; 2025 Ateliê Débora Freitas. Todos os direitos reservados.
  </footer>
</body>
</html>
