<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <link rel="icon" href="android-chrome-192x192.png" type="image/png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Início - Atelier Débora Freitas</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="module">
    import { checkAuth, logout } from './js/auth.js';
    checkAuth();
    window.logout = logout;
  </script>

  <style>
    /* Page specific overrides utilizing variables */
    main {
      max-width: 900px;
      margin: 40px auto;
      width: 95%;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .menu-item {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius);
      padding: 30px 20px;
      text-align: center;
      color: var(--text);
      font-weight: 600;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      font-size: 1.1rem;
      box-shadow: var(--shadow);
    }

    .menu-item:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-5px);
    }
  </style>
  <script type="module" src="/js/firebase-config.js"></script>
</head>

<body>
  <header>
    <h1>Ateliê Débora Freitas</h1>
    <button onclick="logout()"
      style="position: absolute; right: 20px; top: 20px; padding: 8px 15px; font-size: 0.7rem;">Sair</button>
  </header>

  <main>
    <h2 style="text-align:center; color: var(--text-muted); font-weight: 300;">Bem-vindo ao seu ERP</h2>

    <div class="menu-grid">
      <a href="dashboard.html" class="menu-item">Dashboard Estoque</a>
      <a href="crm.html" class="menu-item">CRM (Clientes)</a>
      <a href="produtos.html" class="menu-item">Produtos</a>
      <a href="contas.html" class="menu-item">Financeiro</a>
      <a href="projetos.html" class="menu-item">Projetos</a>
      <a href="tarefas.html" class="menu-item">Quadro de Tarefas</a>
      <a href="saida.html" class="menu-item">Saída de Estoque</a>
      <a href="gestao.html" class="menu-item">Gestão à Vista</a>
      <a href="vendas.html" class="menu-item">Vendas & Locação</a>
      <a href="relatorios.html" class="menu-item">Relatórios</a>
      <a href="dossies.html" class="menu-item">Dossiê Técnico (PDF)</a>
    </div>
  </main>

  <footer>
    &copy; 2025 Ateliê Débora Freitas. Todos os direitos reservados.
  </footer>
</body>

</html>
