      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    .logo {
      width: 400px;
      height: 100px;
      display: block;
      margin-bottom: 20px;
