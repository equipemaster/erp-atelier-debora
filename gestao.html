<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão à Vista – Projetos em Andamento x Finalizado</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    body {
      font-family: 'Playfair Display', serif;
      background: linear-gradient(135deg, #0d2d0e, #153d4f);
      color: #fff;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      color: #c7a17a;
      font-size: 2rem;
      margin-bottom: 2rem;
    }
    canvas {
      max-width: 600px;
      width: 100%;
      height: 350px;
      background: #111;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
      margin: auto;
      display: block;
    }
    .voltar {
      margin-top: 2rem;
      display: inline-block;
      padding: 10px 20px;
      background: #c7a17a;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.3s;
    }
    .voltar:hover {
      background: #a87b51;
    }
  </style>
</head>
<body>
  <h1>Gestão à Vista – Projetos</h1>
  <canvas id="graficoGestao"></canvas>
  <a href="home.html" class="voltar">⬅ Voltar ao Menu</a>

  <script>
    const firebaseConfig = {
      apiKey: "...",
      authDomain: "...",
      databaseURL: "...",
      projectId: "...",
      appId: "..."
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    auth.onAuthStateChanged(user => {
      if (!user) return window.location = 'index.html';
      initChart();
    });

    let chart = null;

    function initChart() {
      updateChart('andamento');
      setInterval(() => {
        const next = (chart.currentData === 'andamento') ? 'finalizado' : 'andamento';
        updateChart(next);
      }, 5000);

      db.ref('projetos').on('value', () => {
        // Quando dados são alterados, re-desenha com filtro atual
        if (chart && chart.currentData) updateChart(chart.currentData);
      });
    }

    function updateChart(filtro) {
      db.ref('projetos').once('value').then(snapshot => {
        let andamento = 0, finalizado = 0;
        snapshot.forEach(p => {
          const s = (p.val().status || '').toLowerCase();
          s.includes('finaliz') ? finalizado++ : andamento++;
        });
        const dataArr = (filtro === 'finalizado') ? [0, finalizado] : [andamento, 0];
        renderChart(dataArr);
        chart.currentData = filtro;
      });
    }

    function renderChart(dataArr) {
      const ctx = document.getElementById('graficoGestao').getContext('2d');
      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Em Andamento', 'Finalizados'],
          datasets: [{
            label: 'Projetos',
            data: dataArr,
            backgroundColor: ['#f39c12', '#2980b9'],
            borderRadius: 8,
            hoverBackgroundColor: ['#f1c40f', '#3498db']
          }]
        },
        options: {
          responsive: true,
          animation: { duration: 1000, easing: 'easeOutQuart' },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#2c3e50',
              titleColor: '#ecf0f1',
              bodyColor: '#ecf0f1',
              padding: 12,
              borderWidth: 1,
              borderColor: '#c7a17a'
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: { precision: 0, color: '#fff' },
              grid: { color: 'rgba(255,255,255,0.1)' }
            },
            x: {
              ticks: { color: '#fff' },
              grid: { color: 'rgba(255,255,255,0.05)' }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
