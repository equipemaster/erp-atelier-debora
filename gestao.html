<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão à Vista - Projetos</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #002e1f, #04303e);
      color: #f8f8f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      min-height: 100vh;
    }

    h1 {
      font-size: 2rem;
      color: #d4af7f;
      margin-bottom: 2rem;
      text-shadow: 1px 1px 4px #000;
    }

    canvas {
      max-width: 600px;
      background: #0d0d0d;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
      padding: 1rem;
      margin-bottom: 2rem;
      transition: transform 0.4s ease;
    }

    canvas:hover {
      transform: scale(1.03);
    }

    .voltar {
      background-color: #d4af7f;
      color: #000;
      text-decoration: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .voltar:hover {
      background-color: #b38e5d;
    }
  </style>
</head>
<body>
  <h1>Gestão à Vista - Projetos</h1>
  <canvas id="graficoGestao"></canvas>
  <a href="home.html" class="voltar">⬅ Voltar ao Menu</a>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDQr7d8DVtzWPPSIAYo1cQg9Swc8IETT3I",
      authDomain: "erp-atelier-debora.firebaseapp.com",
      databaseURL: "https://erp-atelier-debora-default-rtdb.firebaseio.com",
      projectId: "erp-atelier-debora",
      appId: "1:1234567890:web:321abc456def7890"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let chart;
    let filtroAtual = 'andamento';

    function desenharGrafico(filtro) {
      db.ref('projetos').once('value').then(snapshot => {
        let andamento = 0, finalizado = 0;

        snapshot.forEach(p => {
          const status = (p.val().status || '').toLowerCase();
          if (status.includes('finaliz')) finalizado++;
          else andamento++;
        });

        const data = filtro === 'finalizado'
          ? [0, finalizado]
          : [andamento, 0];

        const ctx = document.getElementById('graficoGestao').getContext('2d');
        if (chart) chart.destroy();

        chart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: ['Em Andamento', 'Finalizados'],
            datasets: [{
              label: 'Projetos',
              data,
              backgroundColor: ['#f39c12', '#27ae60'],
              borderRadius: 8
            }]
          },
          options: {
            animation: {
              duration: 800,
              easing: 'easeOutBounce'
            },
            plugins: {
              legend: { display: false }
            },
            scales: {
              y: {
                beginAtZero: true,
                ticks: {
                  precision: 0,
                  color: '#fff'
                },
                grid: {
                  color: 'rgba(255, 255, 255, 0.1)'
                }
              },
              x: {
                ticks: { color: '#fff' },
                grid: {
                  color: 'rgba(255, 255, 255, 0.1)'
                }
              }
            }
          }
        });
      });
    }

    desenharGrafico(filtroAtual);

    setInterval(() => {
      filtroAtual = filtroAtual === 'andamento' ? 'finalizado' : 'andamento';
      desenharGrafico(filtroAtual);
    }, 5000);

    db.ref('projetos').on('child_added', () => desenharGrafico(filtroAtual));
    db.ref('projetos').on('child_changed', () => desenharGrafico(filtroAtual));
    db.ref('projetos').on('child_removed', () => desenharGrafico(filtroAtual));
  </script>
</body>
</html>
