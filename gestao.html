<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão à Vista - Projetos</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    body {
      font-family: 'Playfair Display', serif;
      background: #0d2d0e;
      color: #fff;
      text-align: center;
      padding: 2rem;
    }
    h1, h2 {
      color: #c7a17a;
      margin-bottom: 1rem;
    }
    canvas {
      max-width: 600px;
      margin: 0 auto;
    }
    .voltar {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 10px 20px;
      background: #c7a17a;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.3s;
    }
    .voltar:hover {
      background: #a87b51;
    }
    #kanbanContainer {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      max-width: 1000px;
      margin: 20px auto;
    }
    #kanbanContainer > div {
      flex: 1;
      background: #f9f3e7;
      padding: 10px;
      border-radius: 6px;
    }
    #kanbanContainer h4 {
      color: #333;
    }
    .card {
      background: #fff;
      color: #000;
      padding: 8px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <a href="home.html" class="voltar">⬅ Voltar ao Menu</a>
  <h1>Gestão à Vista - Projetos</h1>

  <div id="painelAlerta"></div>

  <section id="visaoEtapas">
    <h2>Visão de Etapas de Produção</h2>
    <div id="kanbanContainer"></div>
  </section>

  <canvas id="graficoGestao"></canvas>

  <section id="cronogramaSemanal">
    <h2>Cronograma Semanal</h2>
    <div id="tabelaCronograma" style="display:flex;justify-content:space-around;flex-wrap:wrap;"></div>
  </section>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDQr7d8DVtzWPPSIAYo1cQg9Swc8IETT3I",
      authDomain: "erp-atelier-debora.firebaseapp.com",
      databaseURL: "https://erp-atelier-debora-default-rtdb.firebaseio.com",
      projectId: "erp-atelier-debora",
      appId: "1:1234567890:web:321abc456def7890"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let chart;
    let filtroAtual = 'andamento';

    function desenharGrafico() {
      db.ref('projetos').once('value').then(snapshot => {
        let andamento = 0, finalizado = 0;
        snapshot.forEach(p => {
          const etapas = p.val().etapas || [];
          const etapaAtual = etapas.find(e => !e.concluido);
          if (!etapaAtual) finalizado++;
          else andamento++;
        });

        const data = [andamento, finalizado];
        const ctx = document.getElementById('graficoGestao').getContext('2d');
        if (chart) chart.destroy();
        chart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: ['Em Andamento', 'Finalizados'],
            datasets: [{ label: 'Projetos', data: data, backgroundColor: ['#f39c12', '#2980b9'] }]
          },
          options: {
            animation: true,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
          }
        });
      });
    }

    auth.onAuthStateChanged(user => {
      if (!user) {
        alert('Você precisa estar logado.');
        window.location.href = 'index.html';
        return;
      }

      desenharGrafico();
      setInterval(() => {
        filtroAtual = filtroAtual === 'andamento' ? 'finalizado' : 'andamento';
        desenharGrafico();
      }, 5000);

      db.ref('projetos').on('value', () => {
        atualizarKanban();
        gerarCronogramaSemanal();
      });

      atualizarAlerta();
      setInterval(atualizarAlerta, 60000);
    });

    function atualizarKanban() {
      const colunas = ['Croqui', 'Modelagem', 'Corte', 'Costura', 'Prova', 'Ajuste', 'Finalizado'];
      const caixa = document.getElementById('kanbanContainer');
      caixa.innerHTML = '';

      colunas.forEach(nome => {
        const coluna = document.createElement('div');
        coluna.id = `coluna-${nome}`;
        coluna.innerHTML = `<h4>${nome}</h4>`;
        caixa.appendChild(coluna);
      });

      db.ref('projetos').once('value').then(snapshot => {
        snapshot.forEach(p => {
          const projeto = p.val();
          const etapas = projeto.etapas || [];
          const etapaAtual = etapas.find(e => !e.concluido);
          const etapaNome = etapaAtual ? etapaAtual.nome : 'Finalizado';

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `<strong>${projeto.nome}</strong><br>
                            <small>Entrega: ${projeto.dataEntrega || '--'}<br>
                            Tipo: ${projeto.tipoProjeto || '-'}</small>`;

          const destino = document.getElementById(`coluna-${etapaNome}`);
          if (destino) destino.appendChild(card);
        });
      });
    }

    function atualizarAlerta() {
      db.ref('projetos').once('value').then(snapshot => {
        let html = '';
        snapshot.forEach(p => {
          const nome = p.val().nome;
          const dataEntrega = p.val().dataEntrega;
          const etapas = p.val().etapas || [];
          const finalizado = etapas.every(e => e.concluido);
          if (!dataEntrega) return;
          const hoje = new Date();
          const dtEntrega = new Date(dataEntrega);
          const dias = Math.ceil((dtEntrega - hoje) / (1000*60*60*24));
          html += `<div style="margin:10px 0;padding:10px;background:${dias <= 3 && !finalizado ? '#ff4d4d' : '#eee'};color:#000;border-radius:5px;">
            Projeto <strong>${nome}</strong> - Entrega em <strong>${dias}</strong> dia(s)
          </div>`;
        });
        document.getElementById('painelAlerta').innerHTML = html;
      });
    }

    function gerarCronogramaSemanal() {
      const diasUteis = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta'];
      const tabela = document.getElementById('tabelaCronograma');
      tabela.innerHTML = '';

      diasUteis.forEach(dia => {
        const coluna = document.createElement('div');
        coluna.style.flex = '1';
        coluna.style.minWidth = '150px';
        coluna.style.margin = '10px';
        coluna.innerHTML = `<h4 style="color:#fff;">${dia}</h4><div id="dia-${dia}" style="background:#f9f3e7;color:#000;border-radius:6px;padding:10px;"></div>`;
        tabela.appendChild(coluna);
      });

      db.ref('projetos').once('value').then(snapshot => {
        const projetos = [];
        snapshot.forEach(p => {
          const val = p.val();
          if (val.dataEntrega) {
            projetos.push({
              nome: val.nome,
              tipo: val.tipoProjeto || '-',
              entrega: new Date(val.dataEntrega)
            });
          }
        });

        projetos.sort((a, b) => a.entrega - b.entrega);
        projetos.slice(0, 5).forEach((proj, i) => {
          const diaId = `dia-${diasUteis[i]}`;
          const div = document.getElementById(diaId);
          const bloco = document.createElement('div');
          bloco.style.marginBottom = '8px';
          bloco.innerHTML = `<strong>${proj.nome}</strong><br><small>Entrega: ${proj.entrega.toLocaleDateString()}<br>Tipo: ${proj.tipo}</small>`;
          div.appendChild(bloco);
        });
      });
    }
  </script>
</body>
</html>
