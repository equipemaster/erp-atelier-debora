<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão à Vista - Projetos</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    body {
      font-family: 'Playfair Display', serif;
      background: #0d2d0e;
      color: #fff;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      color: #c7a17a;
      margin-bottom: 2rem;
    }
    canvas {
      max-width: 600px;
      margin: 0 auto;
    }
    .voltar {
      position: absolute;
      top: 20px;
      right: 20px;
      padding: 10px 20px;
      background: #c7a17a;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.3s;
    }
    .voltar:hover {
      background: #a87b51;
    }
    #kanbanContainer {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      max-width: 1000px;
      margin: 20px auto;
    }
    #kanbanContainer > div {
      flex: 1;
      background: #f9f3e7;
      padding: 10px;
      border-radius: 6px;
    }
    #kanbanContainer h4 {
      color: #333;
    }
    #kanbanContainer .card {
      background: #fff;
      color: #000;
      padding: 8px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <a href="home.html" class="voltar">⬅ Voltar ao Menu</a>
  <h1>Gestão à Vista - Projetos</h1>

  <div id="painelAlerta"></div>

  <section id="visaoEtapas">
    <h2 style="color:#c7a17a;">Visão de Etapas de Produção</h2>
    <div id="kanbanContainer"></div>
  </section>

  <canvas id="graficoGestao"></canvas>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDQr7d8DVtzWPPSIAYo1cQg9Swc8IETT3I",
      authDomain: "erp-atelier-debora.firebaseapp.com",
      databaseURL: "https://erp-atelier-debora-default-rtdb.firebaseio.com",
      projectId: "erp-atelier-debora",
      appId: "1:1234567890:web:321abc456def7890"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let chart;
    let filtroAtual = 'andamento';

    function desenharGrafico(statusFiltro) {
      db.ref('projetos').once('value').then(snapshot => {
        let andamento = 0;
        let finalizado = 0;
        snapshot.forEach(p => {
          const status = p.val().status?.toLowerCase() || '';
          if (status.includes('finaliz')) finalizado++;
          else andamento++;
        });

        const data = statusFiltro === 'finalizado' ? [0, finalizado] : [andamento, 0];
        const ctx = document.getElementById('graficoGestao').getContext('2d');
        if (chart) chart.destroy();
        chart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: ['Em Andamento', 'Finalizados'],
            datasets: [{ label: 'Projetos', data: data, backgroundColor: ['#f39c12', '#2980b9'] }]
          },
          options: {
            animation: true,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
          }
        });
      }).catch(error => console.error("Erro ao carregar dados:", error));
    }

    auth.onAuthStateChanged(user => {
      if (!user) {
        alert('Você precisa estar logado.');
        window.location.href = 'index.html';
        return;
      }
      desenharGrafico(filtroAtual);
      setInterval(() => {
        filtroAtual = filtroAtual === 'andamento' ? 'finalizado' : 'andamento';
        desenharGrafico(filtroAtual);
      }, 5000);

      db.ref('projetos').on('child_changed', () => desenharGrafico(filtroAtual));
      db.ref('projetos').on('child_added', () => desenharGrafico(filtroAtual));
      db.ref('projetos').on('child_removed', () => desenharGrafico(filtroAtual));
    });

    const colunas = ['Croqui','Modelagem','Corte','Costura','Prova','Ajuste','Finalizado'];

    function atualizarKanban() {
      db.ref('projetos').once('value').then(snap => {
        const projetos = [];
        snap.forEach(p => projetos.push({ id: p.key, ...p.val() }));

        const caixa = document.getElementById('kanbanContainer');
        caixa.innerHTML = '';
        colunas.forEach(nomeCol => {
          const coluna = document.createElement('div');
          coluna.innerHTML = `<h4>${nomeCol}</h4>`;
          projetos.filter(p => p.status?.toLowerCase() === nomeCol.toLowerCase()).forEach(p => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<strong>${p.nome}</strong><br><small>Entrega: ${p.dataEntrega || '--:--'}<br>Tipo: ${p.tipo || '-'}</small>`;
            coluna.appendChild(card);
          });
          caixa.appendChild(coluna);
        });
      });
    }

    db.ref('projetos')
      .on('child_added', atualizarKanban)
      .on('child_changed', atualizarKanban)
      .on('child_removed', atualizarKanban);
    atualizarKanban();

    function atualizarAlerta() {
      db.ref('projetos').once('value').then(snapshot => {
        let html = '';
        snapshot.forEach(p => {
          const nome = p.val().nome;
          const dataEntrega = p.val().dataEntrega;
          const status = (p.val().status || '').toLowerCase();
          if (!dataEntrega) return;
          const hoje = new Date();
          const dtEntrega = new Date(dataEntrega);
          const dias = Math.ceil((dtEntrega - hoje) / (1000*60*60*24));

          html += `<div style="margin:10px 0;padding:10px;background:${dias <= 3 && status !== 'finalizado' ? '#ff4d4d' : '#eee'};color:#000;border-radius:5px;">
            Projeto <strong>${nome}</strong> - Entrega em <strong>${dias}</strong> dia(s)
          </div>`;
        });
        document.getElementById('painelAlerta').innerHTML = html;
      });
    }

    setInterval(atualizarAlerta, 60000);
    atualizarAlerta();
  </script>
</body>
</html>
