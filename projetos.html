        // Função para formatar milissegundos em HH:MM:SS
        function formatarTempo(ms) {
            if (ms === null || isNaN(ms) || ms < 0) return "00h 00m 00s"; // Garante que não exiba N/A ou valores negativos
            const totalSeconds = Math.floor(ms / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            const pad = (num) => num.toString().padStart(2, '0');
            return `${pad(hours)}h ${pad(minutes)}m ${pad(seconds)}s`;
        }

        // Função para cadastrar um novo projeto
        function cadastrarProjeto() {
            const nome = document.getElementById('nomeProjeto').value.trim();
            const status = document.getElementById('statusInicial').value;
            const data = document.getElementById('dataEntrega').value;
            const hora = document.getElementById('horaEntrega').value;
            const tipo = document.getElementById('tipoProjeto').value;

            // Validação simples
            if (!nome || status === 'Selecione a etapa inicial' || !data || !hora || tipo === 'Tipo') {
                alert('Por favor, preencha todos os campos para cadastrar o projeto.');
                return;
            }

            const projeto = {
                nome,
                statusAtual: status,
                dataEntrega: data,
                horaEntrega: hora,
                tipoProjeto: tipo,
                etapas: [{ nome: status, inicio: Date.now(), fim: null }] // Adicionado 'fim: null' para a etapa inicial
            };

            // Salva o projeto no Firebase
            db.ref('projetos').push(projeto).then(() => {
                alert('Projeto cadastrado com sucesso! ✅');
                // Limpa o formulário após o cadastro
                document.getElementById('nomeProjeto').value = '';
                document.getElementById('statusInicial').value = 'Selecione a etapa inicial';
                document.getElementById('dataEntrega').value = '';
                document.getElementById('horaEntrega').value = '';
                document.getElementById('tipoProjeto').value = 'Tipo';
                // As funções desenharKanban e desenharHistorico são chamadas automaticamente pelo 'on("value")'
            }).catch(error => {
                console.error("Erro ao cadastrar projeto:", error);
                alert("Ocorreu um erro ao cadastrar o projeto. Por favor, tente novamente.");
            });
        }
// Função voltarEtapa 
async function voltarEtapa(id, statusAtual) {
const currentIndex = etapasKanban.indexOf(statusAtual);


if (currentIndex <= 0) {
alert("Este projeto já está na primeira etapa.");
return;
}


const projetoRef = db.ref('projetos/' + id);
await projetoRef.once('value').then(async snapshot => {
const projeto = snapshot.val();
if (!projeto) return;


let etapas = projeto.etapas || [];


// Finaliza a etapa atual
const etapaAtual = etapas.find(e => e.nome === statusAtual && e.fim === null);
if (etapaAtual) {
etapaAtual.fim = Date.now();
}


const etapaAnterior = etapasKanban[currentIndex - 1];


etapas.push({ nome: etapaAnterior, inicio: Date.now(), fim: null });


await projetoRef.update({
statusAtual: etapaAnterior,
etapas: etapas
});


alert(`Projeto retornado para: ${etapaAnterior} 👈`);
}).catch(error => {
console.error("Erro ao retornar etapa:", error);
alert("Ocorreu um erro ao retornar a etapa do projeto.");
});
}
        // Função para desenhar o quadro Kanban
        function desenharKanban() {
            const kanbanContainer = document.getElementById('kanbanContainer');
            kanbanContainer.innerHTML = ''; // Limpa o container para evitar duplicação de colunas

            // Cria as colunas do Kanban
            etapasKanban.forEach(etapa => {
                const coluna = document.createElement('div');
                coluna.id = `coluna-${etapa.toLowerCase().replace(/\s/g, '')}`; // ID único para a coluna
                coluna.innerHTML = `<h3>${etapa}</h3>`;
                kanbanContainer.appendChild(coluna);
            });

            // Escuta as mudanças nos projetos em tempo real no Firebase
            db.ref('projetos').on('value', (snapshot) => {
                const projetos = snapshot.val();

                // Limpa todos os cartões existentes em todas as colunas antes de redesenhar
                etapasKanban.forEach(etapa => {
                    const colunaDiv = document.getElementById(`coluna-${etapa.toLowerCase().replace(/\s/g, '')}`);
                    if (colunaDiv) {
                        Array.from(colunaDiv.children).forEach(child => {
                            if (child.classList.contains('card')) {
                                colunaDiv.removeChild(child);
                            }
                        });
                    }
                });

                if (projetos) {
                    Object.keys(projetos).forEach(key => {
                        const projeto = projetos[key];
                        // Exibe todos os projetos no Kanban, incluindo "Finalizado"
                        if (etapasKanban.includes(projeto.statusAtual)) {
                            const card = document.createElement('div');
                            card.classList.add('card');
                            card.setAttribute('data-id', key); // Armazena o ID do Firebase no cartão
                            dt = new Date(projeto.dataEntrega)
                            const formattedDate = new Intl.DateTimeFormat('pt-BR').format(dt);
                           // console.log("testhhhhhe",formattedDate); // Saída: 02/01/2024

                            let buttonsHtml = `
                                <button onclick="abrirModalEdicao('${key}', '${projeto.nome}', '${formattedDate}', '${projeto.horaEntrega}', '${projeto.tipoProjeto}')">Editar</button>
                            `;

                           if (projeto.statusAtual !== 'Finalizado') {
                            const currentIndex = etapasKanban.indexOf(projeto.statusAtual);
                                            if (currentIndex > 0) {
                            buttonsHtml += `<button onclick="voltarEtapa('${key}', '${projeto.statusAtual}')" style="background-color: #ffc107; color: #333;">Voltar</button>`;
    }
                            buttonsHtml += `<button onclick="avancarEtapa('${key}', '${projeto.statusAtual}')" style="background-color: #28a745;">Próximo</button>`;
                        } else {
                                buttonsHtml += `<button onclick="restaurarProjeto('${key}', '${etapasKanban[0]}')" style="background-color: #007bff;">Restaurar</button>`;
        }
                            buttonsHtml += `<button onclick="deletarProjeto('${key}')" style="background-color: #dc3545;">Excluir</button>`;
                            card.innerHTML = `
                                <strong>${projeto.nome}</strong> (${projeto.tipoProjeto})<br>
                                Entrega: ${formattedDate} às ${projeto.horaEntrega}<br>
                                Status: ${projeto.statusAtual}
                                <div class="card-actions">${buttonsHtml}</div>
                            `;
                            const colunaDestino = document.getElementById(`coluna-${projeto.statusAtual.toLowerCase().replace(/\s/g, '')}`);
                            if (colunaDestino) {
                                colunaDestino.appendChild(card);
                            }
                        }
                    });
                }
            });
        }

        // Função para avançar o projeto para a próxima etapa no Kanban
        async function avancarEtapa(id, statusAtual) {
            const currentIndex = etapasKanban.indexOf(statusAtual);

            if (currentIndex === -1) {
                alert("Status atual inválido.");
                return;
            }

            // Busca os dados atuais do projeto para manipular as etapas
            const projetoRef = db.ref('projetos/' + id);
            await projetoRef.once('value').then(async snapshot => {
                const projeto = snapshot.val();
                if (!projeto) return;

               let etapas = Array.isArray(projeto.etapas) ? projeto.etapas.filter(e => e && e.nome) : [];
;
;
                // Encontra a última etapa registrada que ainda não tem 'fim' e a finaliza
                const ultimaEtapaAtiva = etapas.find(e => e && e.nome === statusAtual && e.fim === null);
;
                if (ultimaEtapaAtiva) {
                    ultimaEtapaAtiva.fim = Date.now();
                } else if (etapas.length > 0) { // Caso a etapa atual já tenha fim, pega a última
                    etapas[etapas.length - 1].fim = Date.now();
                }

                const proximoStatus = etapasKanban[currentIndex + 1];

                if (proximoStatus) {
                    // Adiciona a nova etapa com início agora e fim null
                    etapas.push({ nome: proximoStatus, inicio: Date.now(), fim: null });
                    await projetoRef.update({
                        statusAtual: proximoStatus,
                        etapas: etapas
                    });
                    alert(`Projeto avançado para: ${proximoStatus} 👍`);
                } else {
                    alert("Este projeto já está na última etapa.");
                }
            }).catch(error => {
                console.error("Erro ao avançar etapa:", error);
                alert("Ocorreu um erro ao avançar a etapa do projeto.");
            });
        }


        // Função para deletar um projeto
        function deletarProjeto(id) {
            if (confirm('Tem certeza que deseja excluir este projeto permanentemente? Essa ação não pode ser desfeita.')) {
                db.ref('projetos/' + id).remove().then(() => {
                    alert('Projeto excluído com sucesso! 🗑️');
                }).catch(error => {
                    console.error("Erro ao excluir projeto:", error);
                    alert("Ocorreu um erro ao excluir o projeto.");
                });
            }
        }

        // Função para desenhar o histórico de projetos finalizados em formato de tabela (reescrita)
        function desenharHistorico() {
            const historicoContainer = document.getElementById('historicoContainer');
             // Limpa o container antes de redesenhar

            db.ref('projetos').on('value', (snapshot) => {
                historicoContainer.innerHTML = '';
                const projetos = snapshot.val();
                let projetosFinalizados = [];

                if (projetos) {
                    Object.keys(projetos).forEach(key => {
                        const projeto = projetos[key];
                        if (projeto.statusAtual === 'Finalizado') {
                            projetosFinalizados.push({ id: key, ...projeto });
                        }
                    });
                }

                //if (projetosFinalizados.length === 0) {
                 //   const noDataP = document.createElement('p');
                  //  noDataP.classList.add('no-data');
                  //  noDataP.textContent = 'Nenhum projeto finalizado ainda.';
                 //   historicoContainer.appendChild(noDataP);
                 //   return;
                //}

                // Cria a tabela
                const table = document.createElement('table');
                const thead = document.createElement('thead');
                const tbody = document.createElement('tbody');

                // Cria o cabeçalho da tabela
                const headerRow = document.createElement('tr');
                ['Nome do Projeto', 'Tipo', 'Data de Entrega', 'Hora de Entrega', 'Etapas (Tempo Gasto)', 'Tempo Total', 'Ações'].forEach(text => {
                    const th = document.createElement('th');
                    th.textContent = text;
                    headerRow.appendChild(th);
                });
                thead.appendChild(headerRow);
                table.appendChild(thead);

                // Preenche o corpo da tabela
                projetosFinalizados.forEach(projeto => {
                    const row = document.createElement('tr');

                    // Nome do Projeto
                    const tdNome = document.createElement('td');
                    tdNome.textContent = projeto.nome;
                    row.appendChild(tdNome);

                    // Tipo
                    const tdTipo = document.createElement('td');
                    tdTipo.textContent = projeto.tipoProjeto;
                    row.appendChild(tdTipo);

                    // Data de Entrega
                    const tdData = document.createElement('td');
                    tdData.textContent = projeto.dataEntrega;
                    row.appendChild(tdData);

                    // Hora de Entrega
                    const tdHora = document.createElement('td');
                    tdHora.textContent = projeto.horaEntrega;
                    row.appendChild(tdHora);

                    // Etapas (Tempo Gasto)
                    const tdEtapas = document.createElement('td');
                    const ulEtapas = document.createElement('ul');
                    let tempoTotalProjeto = 0;

                    if (projeto.etapas) {
                        projeto.etapas.forEach((etapa) => {
                            const inicio = etapa.inicio;
                            const fim = etapa.fim;

                            let tempoGasto = null;
                            if (inicio && fim) {
                                tempoGasto = fim - inicio;
                                tempoTotalProjeto += tempoGasto;
                            }
                            
                            const li = document.createElement('li');
                            li.textContent = `${etapa.nome}: ${formatarTempo(tempoGasto)}`;
                            ulEtapas.appendChild(li);
                        });
                    }
                    tdEtapas.appendChild(ulEtapas);
                    row.appendChild(tdEtapas);

                    // Tempo Total
                    const tdTempoTotal = document.createElement('td');
                    tdTempoTotal.textContent = formatarTempo(tempoTotalProjeto);
                    row.appendChild(tdTempoTotal);

                    // Ações
                    const tdAcoes = document.createElement('td');
                    tdAcoes.classList.add('historico-actions');
                    
                    const btnRestaurar = document.createElement('button');
                    btnRestaurar.textContent = 'Restaurar';
                    btnRestaurar.style.backgroundColor = '#007bff';
                    btnRestaurar.onclick = () => restaurarProjeto(projeto.id, etapasKanban[0]);
                    tdAcoes.appendChild(btnRestaurar);

                    const btnExcluir = document.createElement('button');
                    btnExcluir.textContent = 'Excluir';
                    btnExcluir.style.backgroundColor = '#dc3545';
                    btnExcluir.onclick = () => deletarProjeto(projeto.id);
                    tdAcoes.appendChild(btnExcluir);

                    row.appendChild(tdAcoes);
                    tbody.appendChild(row);
                });

                table.appendChild(tbody);
                historicoContainer.appendChild(table);
            });
        }

        // Variável para armazenar o ID do projeto que está sendo editado no modal
        let projetoIdEdicao = null;

        // Função para abrir o modal de edição e preencher os campos
        function abrirModalEdicao(id, nome, data, hora, tipo) {
            projetoIdEdicao = id; // Armazena o ID do projeto atual
            document.getElementById('editNome').value = nome;
            document.getElementById('editData').value = data;
            document.getElementById('editHora').value = hora;
            document.getElementById('editTipo').value = tipo;
            document.getElementById('modalEdicao').style.display = 'block'; // Exibe o modal
        }

        // Função para salvar as edições do projeto
        function salvarEdicao() {
            const id = projetoIdEdicao;
            const novoNome = document.getElementById('editNome').value.trim();
            const novaData = document.getElementById('editData').value;
            const novaHora = document.getElementById('editHora').value;
            const novoTipo = document.getElementById('editTipo').value;

            if (!novoNome || !novaData || !novaHora || !novoTipo) {
                alert('Por favor, preencha todos os campos para editar o projeto.');
                return;
            }

            db.ref('projetos/' + id).update({
                nome: novoNome,
                dataEntrega: novaData,
                horaEntrega: novaHora,
                tipoProjeto: novoTipo
            }).then(() => {
                alert('Projeto atualizado com sucesso! ✨');
                document.getElementById('modalEdicao').style.display = 'none'; // Esconde o modal
            }).catch(error => {
                console.error("Erro ao salvar edição:", error);
                alert("Ocorreu um erro ao salvar as edições do projeto.");
            });
        }

        // Função para restaurar um projeto do histórico para a primeira etapa do Kanban
        async function restaurarProjeto(id, primeiraEtapa) {
            if (confirm('Tem certeza que deseja restaurar este projeto para a primeira etapa do Kanban ("' + primeiraEtapa + '")?')) {
                await db.ref('projetos/' + id).once('value').then(async snapshot => {
                    const projeto = snapshot.val();
                    let etapas = projeto.etapas || [];

                    // Garante que a última etapa (Finalizado) tenha um 'fim' registrado se não tiver
                    const ultimaEtapa = etapas[etapas.length - 1];
                    if (ultimaEtapa && ultimaEtapa.nome === 'Finalizado' && ultimaEtapa.fim === null) {
                        ultimaEtapa.fim = Date.now();
                    }

                    // Adiciona a nova etapa inicial como a etapa ativa
                    etapas.push({ nome: primeiraEtapa, inicio: Date.now(), fim: null });

                    return db.ref('projetos/' + id).update({
                        statusAtual: primeiraEtapa, // Define o status para a primeira etapa
                        etapas: etapas
                    });
                }).then(() => {
                    alert('Projeto restaurado com sucesso! 🎉 Ele agora está de volta ao quadro Kanban.');
                }).catch(error => {
                    console.error("Erro ao restaurar projeto:", error);
                    alert("Ocorreu um erro ao restaurar o projeto.");
                });
            }
        }

        // Chama as funções de desenho quando a página é completamente carregada
        document.addEventListener('DOMContentLoaded', () => {
            desenharKanban();
            desenharHistorico();
        });
    </script>
