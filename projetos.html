<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projetos - Kanban</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <!-- Chart.js opcional -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* Estilização do layout responsivo */
    #kanban {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 1rem;
      padding: 1rem;
      margin: 2rem auto;
      max-width: 95vw;
    }
    #kanban > div {
      background: #fff;
      color: #000;
      border-radius: 8px;
      padding: 1rem;
      min-width: 180px;
      flex: 1;
      max-width: 250px;
      flex-shrink: 0;
    }
    #kanban h3 {
      background-color: #c7a17a;
      color: white;
      padding: 5px;
      border-radius: 4px;
      text-align: center;
      font-size: 1rem;
    }
    #kanban div div {
      margin-top: 0.5rem;
      padding: 0.5rem;
      background: #f3f3f3;
      border-radius: 6px;
      overflow-wrap: break-word;
      font-size: 0.9rem;
    }
    select { width: 100%; margin-top: 5px; }
    .kanban-container { overflow-x: auto; }
    .botao-voltar {
      margin: 2rem auto;
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>
  <h1>Projetos</h1>
  <!-- Formulário de Cadastro de Projetos -->
  <div>
    <input type="text" id="nomeProjeto" placeholder="Nome do projeto">
    <input type="text" id="statusInicial" placeholder="Status inicial">
    <input type="date" id="dataEntrega">
    <input type="time" id="horaEntrega">
    <select id="tipoProjeto">
      <option disabled selected>Tipo</option>
      <option>Noiva - Sob Medida</option>
      <option>Noiva - Locacao</option>
      <option>Festa - Sob Medida</option>
      <option>Casual</option>
    </select>
    <button onclick="cadastrarProjeto()">Cadastrar</button>
  </div>

  <!-- Quadro Kanban -->
  <div id="kanban"></div>

  <!-- Alerta de prazo -->
  <div id="alertas"></div>

  <!-- Botão para voltar ao menu -->
  <div class="botao-voltar">
    <a href="home.html">
      <button>Voltar ao Menu</button>
    </a>
  </div>

  <!-- Script de funcionalidade -->
  <script>
    const firebaseConfig = {
      apiKey: "SUA_APIKEY",
      authDomain: "erp-atelier-debora.firebaseapp.com",
      databaseURL: "https://erp-atelier-debora-default-rtdb.firebaseio.com",
      projectId: "erp-atelier-debora",
      appId: "SEU_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    auth.onAuthStateChanged(user => {
      if (!user) return;
      desenharKanban();
      exibirAlertas();
      setInterval(exibirAlertas, 30000);
    });

    function cadastrarProjeto() {
      const nome = document.getElementById('nomeProjeto').value;
      const status = document.getElementById('statusInicial').value;
      const data = document.getElementById('dataEntrega').value;
      const hora = document.getElementById('horaEntrega').value;
      const tipo = document.getElementById('tipoProjeto').value;
      if (!nome || !status || !data || !hora || tipo.startsWith('Tipo')) {
        alert('Preencha todos os campos.');
        return;
      }
      const projeto = {
        nome, status,
        dataEntrega: data,
        horaEntrega: hora,
        tipoProjeto: tipo,
        etapas: [{
          nome: status,
          inicio: Date.now(),
          duracaoEstimativa: 72 * 3600 * 1000,
          concluido: false,
          duracaoReal: 0
        }]
      };
      const id = db.ref('projetos').push().key;
      db.ref('projetos/' + id).set(projeto).then(() => {
        document.getElementById('nomeProjeto').value = '';
        document.getElementById('statusInicial').value = '';
        document.getElementById('dataEntrega').value = '';
        document.getElementById('horaEntrega').value = '';
        document.getElementById('tipoProjeto').selectedIndex = 0;
      });
    }

    function desenharKanban() {
      const colunas = ['Croqui','Modelagem','Corte','Costura','Prova','Ajuste','Finalizado'];
      const kanban = document.getElementById('kanban');
      kanban.innerHTML = '';
      colunas.forEach(c => {
        const div = document.createElement('div');
        div.innerHTML = `<h3>${c}</h3><div id="coluna-${c}"></div>`;
        kanban.appendChild(div);
      });
      db.ref('projetos').on('value', snapshot => {
        colunas.forEach(c => document.getElementById(`coluna-${c}`).innerHTML = '');
        snapshot.forEach(proj => {
          const id = proj.key;
          const dados = proj.val();
          dados.etapas?.forEach((etapa, idx) => {
            const div = document.createElement('div');
            div.innerHTML = `
              <div><strong>${dados.nome}</strong></div>
              <div>${etapa.nome}</div>
              <div>Entrega: ${dados.dataEntrega}</div>
              <select onchange="mudarStatusEtapa('${id}', ${idx}, this.value)">
                <option ${etapa.concluido ? '' : 'selected'}>Em andamento</option>
                <option ${etapa.concluido ? 'selected' : ''}>Concluído</option>
              </select>`;
            const coluna = document.getElementById(`coluna-${etapa.nome}`);
            if (coluna) coluna.appendChild(div);
          });
        });
      });
    }

    function mudarStatusEtapa(projId, idx, status) {
      const ref = db.ref(`projetos/${projId}/etapas/${idx}`);
      ref.once('value').then(snap => {
        const etapa = snap.val();
        if (status === 'Concluído') {
          const fim = Date.now();
          const real = fim - etapa.inicio;
          ref.update({ concluido: true, duracaoReal: real });
          abrirProximaEtapa(projId, idx + 1);
        }
      });
    }

    function abrirProximaEtapa(projId, idx) {
      const nomes = ['Croqui','Modelagem','Corte','Costura','Prova','Ajuste','Finalizado'];
      const nomeEtapa = nomes[idx];
      if (!nomeEtapa) return;
      const ref = db.ref(`projetos/${projId}/etapas/${idx}`);
      ref.once('value').then(snap => {
        if (!snap.exists()) {
          ref.set({ nome: nomeEtapa, inicio: Date.now(), duracaoEstimativa: 48 * 3600 * 1000, concluido: false, duracaoReal: 0 });
        }
      });
    }

    function exibirAlertas() {
      db.ref('projetos').once('value').then(snapshot => {
        let alerta = '';
        snapshot.forEach(proj => {
          const p = proj.val();
          const data = new Date(`${p.dataEntrega}T${p.horaEntrega}`);
          const dias = (data - Date.now()) / (1000 * 60 * 60 * 24);
          const finalizado = p.etapas?.some(e => e.nome === 'Finalizado' && e.concluido);
          if (dias <= 3 && !finalizado) alerta += `<p>⚠️ ${p.nome} vence em ${Math.ceil(dias)} dias!</p>`;
        });
        document.getElementById('alertas').innerHTML = alerta;
      });
    }
  </script>
</body>
</html>
