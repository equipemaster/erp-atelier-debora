<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projetos</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    #kanbanContainer {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 10px;
      padding: 20px;
    }
    #kanbanContainer > div {
      min-width: 220px;
      flex: 0 0 auto;
      background: #f9f3e7;
      padding: 10px;
      border-radius: 6px;
    }
    #kanbanContainer h4 {
      color: #333;
      text-align: center;
    }
    .card {
      background: #fff;
      color: #000;
      padding: 8px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    select {
      width: 100%;
      margin-top: 5px;
    }
    .btn-voltar {
      margin: 2rem auto;
      display: block;
      padding: 10px 20px;
      background: #c7a17a;
      color: white;
      border: none;
      border-radius: 6px;
      text-decoration: none;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Projetos</h1>
  <div id="kanbanContainer"></div>
  <a href="home.html" class="btn-voltar">Voltar ao Menu</a>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDQr7d8DVtzWPPSIAYo1cQg9Swc8IETT3I",
      authDomain: "erp-atelier-debora.firebaseapp.com",
      databaseURL: "https://erp-atelier-debora-default-rtdb.firebaseio.com",
      projectId: "erp-atelier-debora",
      appId: "252603842873"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    function desenharKanban() {
      const colunas = ['Croqui','Modelagem','Corte','Costura','Prova','Ajuste','Finalizado'];
      const kanban = document.getElementById('kanbanContainer');
      kanban.innerHTML = '';
      colunas.forEach(c => {
        const div = document.createElement('div');
        div.innerHTML = `<h4>${c}</h4><div id="coluna-${c}"></div>`;
        kanban.appendChild(div);
      });

      db.ref('projetos').off('value');
      db.ref('projetos').on('value', snapshot => {
        colunas.forEach(c => document.getElementById(`coluna-${c}`).innerHTML = '');
        snapshot.forEach(proj => {
          const id = proj.key;
          const dados = proj.val();

          dados.etapas?.forEach((etapa, idx) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `${id}-etapa-${idx}`;

            card.innerHTML = `
              <strong>${dados.nome}</strong><br>
              <em>${etapa.nome}</em><br>
              <select onchange="mudarStatusEtapa('${id}', ${idx}, this.value)">
                <option ${!etapa.concluido ? 'selected' : ''}>Em andamento</option>
                <option ${etapa.concluido ? 'selected' : ''}>Concluído</option>
              </select>`;

            const coluna = document.getElementById(`coluna-${etapa.nome}`);
            if (coluna) coluna.appendChild(card);
          });
        });
      });
    }

    async function mudarStatusEtapa(projId, idx, status) {
      const ref = db.ref(`projetos/${projId}/etapas/${idx}`);
      const snap = await ref.once('value');
      const etapa = snap.val();

      if (status === 'Concluído') {
        const fim = Date.now();
        const real = fim - etapa.inicio;
        await ref.update({ concluido: true, duracaoReal: real });

        const oldCard = document.getElementById(`${projId}-etapa-${idx}`);
        if (oldCard?.parentNode) oldCard.parentNode.removeChild(oldCard);

        abrirProximaEtapa(projId, idx + 1);
      }
    }

    function abrirProximaEtapa(projId, idx) {
      const nomes = ['Croqui','Modelagem','Corte','Costura','Prova','Ajuste','Finalizado'];
      const nomeEtapa = nomes[idx];
      if (!nomeEtapa) return;
      const ref = db.ref(`projetos/${projId}/etapas/${idx}`);
      ref.once('value').then(snap => {
        if (!snap.exists()) {
          ref.set({ nome: nomeEtapa, inicio: Date.now(), duracaoEstimativa: 48 * 3600 * 1000, concluido: false, duracaoReal: 0 });
        }
      });
    }

    auth.onAuthStateChanged(user => {
      if (user) {
        desenharKanban();
      }
    });
  </script>
</body>
</html>
