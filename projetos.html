<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projetos</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    /* Kanban responsivo */
    #kanbanContainer { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px auto; padding: 0 20px; }
    #kanbanContainer > div { flex: 1; background: #f9f3e7; padding: 10px; border-radius: 6px; min-width: 160px; }
    #kanbanContainer h3 { text-align: center; margin-bottom:10px; color: #333; font-size: 1rem; }
    .card { background: #fff; color: #000; padding: 8px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; font-size: 0.875rem; }
    .report, .history { max-width: 1000px; margin: 20px auto; padding: 10px; background: #f0f0f0; border-radius: 6px; }
    .report h4, .history h4 { margin-top: 0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px; border: 1px solid #ccc; text-align: left; }
    select { width: 100%; margin-top: 5px; }
    .alerta { background: #0e2d0f; color:white; text-align:center; padding:1rem; margin:20px auto; border-radius:8px; }
    .btn-voltar { display:block; margin:20px auto; padding:10px 20px; background:#c7a17a; color:white; border:none; border-radius:6px; text-decoration:none; text-align:center; }
  </style>
</head>
<body>
  <h1>Projetos</h1>
  <button onclick="logout()">Sair</button>

  <!-- Formulário -->
  <div>
    <input type="text" id="nomeProjeto" placeholder="Nome do projeto" />
    <select id="statusInicial">
      <option disabled selected>Selecione etapa inicial</option>
      <option>Croqui</option><option>Modelagem</option><option>Corte</option><option>Costura</option><option>Prova</option><option>Ajuste</option>
    </select>
    <input type="date" id="dataEntrega" />
    <input type="time" id="horaEntrega" />
    <select id="tipoProjeto">
      <option disabled selected>Tipo</option>
      <option>Noiva - Sob Medida</option><option>Noiva - Locação</option><option>Festa - Sob Medida</option><option>Casual</option>
    </select>
    <button onclick="cadastrarProjeto()">Cadastrar Projeto</button>
  </div>

  <!-- Kanban -->
  <div id="kanbanContainer"></div>

  <!-- Histórico -->
  <div class="history">
    <h4>📜 Histórico das Etapas Concluídas</h4>
    <table id="tblHistorico">
      <thead><tr><th>Projeto</th><th>Etapa</th><th>Estimado (h)</th><th>Real (h)</th></tr></thead><tbody></tbody>
    </table>
  </div>

  <!-- Relatórios -->
  <div class="report">
    <h4>📈 Relatório: Tempo Estimado x Real por Projeto</h4>
    <canvas id="chartReport" height="150"></canvas>
  </div>

  <div id="alertas" class="alerta"></div>
  <a href="home.html" class="btn-voltar">Voltar ao Menu</a>

<script>
const firebaseConfig = { /*...seu config...*/ };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
let reportChart;

// Quando logado, carrega dados
auth.onAuthStateChanged(user => {
  if (!user) location.href='index.html';
  desenharKanban(); populaHistorico(); geraRelatorio(); exibirAlertas();
  setInterval(exibirAlertas, 30000);
});

// Sair
function logout(){ auth.signOut().then(()=>location.href='index.html') }

// Cadastro
function cadastrarProjeto(){
  const nome = document.getElementById('nomeProjeto').value.trim();
  const status = document.getElementById('statusInicial').value;
  const data = document.getElementById('dataEntrega').value;
  const hora = document.getElementById('horaEntrega').value;
  const tipo = document.getElementById('tipoProjeto').value;
  if(!nome||!status||!data||!hora||tipo.startsWith('Tipo')) return alert('Preencha todos os campos.');
  const projeto = { nome, status, dataEntrega:data, horaEntrega:hora, tipoProjeto:tipo,
    etapas:[{ nome:status, inicio:Date.now(), duracaoEstimativa:72*3600*1000, concluido:false, duracaoReal:0 }]
  };
  db.ref('projetos').push(projeto).then(()=>{
    document.getElementById('nomeProjeto').value='';
    document.getElementById('statusInicial').selectedIndex=0;
    document.getElementById('dataEntrega').value='';
    document.getElementById('horaEntrega').value='';
    document.getElementById('tipoProjeto').selectedIndex=0;
    desenharKanban();});
}

// Kanban
function desenharKanban(){
  const cols=['Croqui','Modelagem','Corte','Costura','Prova','Ajuste','Finalizado'];
  const k = document.getElementById('kanbanContainer');
  k.innerHTML=''; cols.forEach(c=>k.innerHTML+=`<div><h3>${c}</h3><div id="col-${c}"></div></div>`);
  db.ref('projetos').on('value',snap=>{
    cols.forEach(c=>document.getElementById(`col-${c}`).innerHTML='');
    snap.forEach(proj=>{
      const id=proj.key,d=proj.val();
      d.etapas?.forEach((e,i)=>{
        const card=document.createElement('div'); card.className='card';
        card.id=`${id}-etapa-${i}`;
        card.innerHTML=`
          <strong>${d.nome}</strong><br>
          <em>${e.nome}</em><br>
          <select onchange="mudarStatusEtapa('${id}',${i},this.value)">
            <option ${!e.concluido?'selected':''}>Em andamento</option>
            <option ${e.concluido?'selected':''}>Concluído</option>
          </select>`;
        document.getElementById(`col-${e.nome}`).appendChild(card);
      });
    });
  });
}

// Avançar etapas
async function mudarStatusEtapa(projId,i,status){
  if(status!=='Concluído') return;
  const ref=db.ref(`projetos/${projId}/etapas/${i}`);
  const snap=await ref.once('value'); const e=snap.val();
  const durReal=Date.now()-e.inicio; await ref.update({concluido:true,duracaoReal:durReal});
  document.getElementById(`${projId}-etapa-${i}`)?.remove(); openNext(projId,i+1);
  populaHistorico(); geraRelatorio();
}

// Próxima etapa
async function openNext(projId,i){
  const names=['Croqui','Modelagem','Corte','Costura','Prova','Ajuste','Finalizado'];
  if(!names[i]) return;
  const ref=db.ref(`projetos/${projId}/etapas/${i}`);
  if(!(await ref.once('value')).exists()){
    ref.set({nome:names[i],inicio:Date.now(),duracaoEstimativa:48*3600*1000,concluido:false,duracaoReal:0});
  }
}

// Histórico
function populaHistorico(){
  db.ref('projetos').once('value',snap=>{
    const rows = [];
    snap.forEach(p=>{
      const d=p.val();
      d.etapas?.filter(e=>e.concluido).forEach(e=>{
        rows.push(`<tr><td>${d.nome}</td><td>${e.nome}</td>
          <td>${(e.duracaoEstimativa/3600000).toFixed(1)}</td><td>${(e.duracaoReal/3600000).toFixed(1)}</td></tr>`);
      });
    });
    document.querySelector('#tblHistorico tbody').innerHTML=rows.join('');
  });
}

// Relatório gráfico
function geraRelatorio(){
  db.ref('projetos').once('value',snap=>{
    const labels=[], est=[], real=[];
    snap.forEach(p=>{
      const d=p.val();
      const totalEst=d.etapas?.reduce((a,e)=>a+e.duracaoEstimativa,0)||0;
      const totalReal=d.etapas?.reduce((a,e)=>a+e.duracaoReal,0)||0;
      labels.push(d.nome); est.push(totalEst/3600000); real.push(totalReal/3600000);
    });
    const ctx=document.getElementById('chartReport');
    reportChart?.destroy();
    reportChart=new Chart(ctx,{type:'bar',data:{labels, datasets:[
      {label:'Estimado (h)', data:est, backgroundColor:'#c7a17a'},
      {label:'Real (h)', data:real, backgroundColor:'#2980b9'}
    ]}});
  });
}

// Alertas
function exibirAlertas(){
  db.ref('projetos').once('value',snap=>{
    let html='';
    snap.forEach(p=>{
      const d=p.val();
      const prazo=new Date(`${d.dataEntrega}T${d.horaEntrega}`);
      const dias=(prazo-Date.now())/(1000*60*60*24);
      const fin=d.etapas?.some(e=>e.nome==='Finalizado'&&e.concluido);
      if(dias<=3 && !fin) html+=`⚠️ ${d.nome} vence em ${Math.ceil(dias)} dias!<br>`;
    });
    document.getElementById('alertas').innerHTML=html;
  });
}
</script>
</body>
</html>
