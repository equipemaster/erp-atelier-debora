<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projetos - Atelier</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    .voltar {
      display: inline-block;
      margin-top: 2rem;
      padding: 10px 20px;
      background: #c7a17a;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.3s;
    }
    .voltar:hover {
      background: #a87b51;
    }
  </style>
</head>
<body>
  <h1>Projetos</h1>

  <section>
    <h2>Cadastro de Projeto</h2>
    <input id="nomeProjeto" placeholder="Nome do projeto">
    <input id="statusProjeto" placeholder="Status (Ex: Em Andamento ou Finalizado)">
    <input id="previsaoProjeto" type="date" placeholder="Previsão de entrega">
    <button onclick="cadastrarProjeto()">Cadastrar</button>
  </section>

  <canvas id="graficoProjetos" width="400" height="300"></canvas>

  <h2>Lista de Projetos</h2>
  <div id="lista-projetos"></div>
  <a href="home.html" class="voltar">⬅ Voltar ao Menu</a>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDQr7d8DVtzWPPSIAYo1cQg9Swc8IETT3I",
      authDomain: "erp-atelier-debora.firebaseapp.com",
      databaseURL: "https://erp-atelier-debora-default-rtdb.firebaseio.com",
      projectId: "erp-atelier-debora",
      appId: "1:1234567890:web:321abc456def7890"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    auth.onAuthStateChanged(user => {
      if (!user) window.location = 'index.html';
    });

    function cadastrarProjeto() {
      const nome = document.getElementById('nomeProjeto').value;
      const status = document.getElementById('statusProjeto').value;
      const previsao = document.getElementById('previsaoProjeto').value;
      if (!nome || !status || !previsao) return alert('Preencha todos os campos!');
      const id = db.ref('projetos').push().key;
      db.ref('projetos/' + id).set({ nome, status, previsao });
      document.getElementById('nomeProjeto').value = '';
      document.getElementById('statusProjeto').value = '';
      document.getElementById('previsaoProjeto').value = '';
      carregarProjetos();
      carregarGraficoProjetos();
    }

    function carregarProjetos() {
      db.ref('projetos').once('value').then(snapshot => {
        const container = document.getElementById('lista-projetos');
        container.innerHTML = '';
        snapshot.forEach(p => {
          const id = p.key;
          const { nome, status, previsao } = p.val();
          container.innerHTML += `
            <div style="margin-bottom:10px;padding:10px;border:1px solid #ccc;border-radius:8px;">
              <strong>${nome}</strong><br>
              Status: ${status} <br>
              Entrega: ${previsao}<br>
              <button onclick="alterarStatus('${id}', '${status}')">Alterar Status</button>
              <button onclick="excluirProjeto('${id}')">Excluir</button>
            </div>
          `;
        });
      });
    }

    function alterarStatus(id, statusAtual) {
      const novoStatus = statusAtual.toLowerCase().includes('finaliz') ? 'Em Andamento' : 'Finalizado';
      db.ref('projetos/' + id).update({ status: novoStatus });
      carregarProjetos();
      carregarGraficoProjetos();
    }

    function excluirProjeto(id) {
      if (confirm('Tem certeza que deseja excluir?')) {
        db.ref('projetos/' + id).remove();
        carregarProjetos();
        carregarGraficoProjetos();
      }
    }

    function carregarGraficoProjetos() {
      const ctx = document.getElementById('graficoProjetos').getContext('2d');
      db.ref('projetos').once('value').then(snapshot => {
        let andamento = 0;
        let finalizado = 0;
        snapshot.forEach(p => {
          const status = p.val().status.toLowerCase();
          if (status.includes('finaliz')) finalizado++;
          else andamento++;
        });

        if (window.graficoProjetos) window.graficoProjetos.destroy();

        window.graficoProjetos = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: ['Em Andamento', 'Finalizados'],
            datasets: [{
              label: 'Projetos',
              data: [andamento, finalizado],
              backgroundColor: ['#f39c12', '#2980b9']
            }]
          },
          options: {
            plugins: {
              legend: { display: false }
            },
            scales: {
              y: { beginAtZero: true, ticks: { precision: 0 } }
            }
          }
        });
      });
    }

    window.onload = () => {
      carregarGraficoProjetos();
      carregarProjetos();
    };
  </script>
</body>
</html>
