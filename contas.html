<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contas - Atelier Débora Freitas</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background: #0d2d0e;
      color: white;
      font-family: 'Arial', sans-serif;
      text-align: center;
    }

    section {
      margin-top: 2rem;
    }

    input, select, button {
      display: block;
      margin: 0.5rem auto;
      padding: 8px;
      border-radius: 4px;
      border: none;
    }

    button {
      background: #c7a17a;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #a87b51;
    }

    #graficoContas {
      max-width: 600px;
      margin: 2rem auto;
    }

    .voltar {
      display: inline-block;
      margin-top: 2rem;
      padding: 10px 20px;
      background: #c7a17a;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    .voltar:hover {
      background: #a87b51;
    }
  </style>
</head>
<body>
  <h1>Contas</h1>

  <section>
    <h2>Cadastro de Conta</h2>
    <input id="descricaoConta" placeholder="Descrição" />
    <input type="number" id="valorConta" placeholder="Valor" />
    <select id="tipoConta">
      <option value="pagar">A Pagar</option>
      <option value="receber">A Receber</option>
    </select>
    <button onclick="registrarConta()">Registrar</button>
  </section>

  <canvas id="graficoContas" width="400" height="300"></canvas>

  <a href="home.html" class="voltar">⬅ Voltar ao Menu</a>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDQr7d8DVtzWPPSIAYo1cQg9Swc8IETT3I",
      authDomain: "erp-atelier-debora.firebaseapp.com",
      databaseURL: "https://erp-atelier-debora-default-rtdb.firebaseio.com",
      projectId: "erp-atelier-debora",
      appId: "1:1234567890:web:321abc456def7890"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    auth.onAuthStateChanged(user => {
      if (!user || (user.email !== 'marneysamuellaraujo2@gmail.com' && user.email !== 'linhadeourobydebora@gmail.com')) {
        alert('Acesso restrito. Redirecionando para o início.');
        window.location = 'home.html';
        return;
      }
      carregarGraficoContas();
    });

    function registrarConta() {
      const descricao = document.getElementById('descricaoConta').value;
      const valor = parseFloat(document.getElementById('valorConta').value);
      const tipo = document.getElementById('tipoConta').value;
      if (!descricao || isNaN(valor)) return alert('Preencha todos os campos!');
      const id = db.ref(`contas/${tipo}`).push().key;
      db.ref(`contas/${tipo}/${id}`).set({ descricao, valor, tipo });
      document.getElementById('descricaoConta').value = '';
      document.getElementById('valorConta').value = '';
      document.getElementById('tipoConta').value = 'pagar';
      carregarGraficoContas();
    }

    function carregarGraficoContas() {
      db.ref('contas').once('value').then(snapshot => {
        let pagar = 0;
        let receber = 0;

        snapshot.forEach(tipo => {
          tipo.forEach(conta => {
            const val = conta.val();
            if (val.tipo === 'pagar') pagar += parseFloat(val.valor);
            if (val.tipo === 'receber') receber += parseFloat(val.valor);
          });
        });

        const ctx = document.getElementById('graficoContas').getContext('2d');
        if (window.graficoContas) window.graficoContas.destroy();
        window.graficoContas = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: ['A Pagar', 'A Receber'],
            datasets: [{
              label: 'Contas',
              data: [pagar, receber],
              backgroundColor: ['#e74c3c', '#27ae60']
            }]
          },
          options: {
            responsive: true,
            scales: {
              y: {
                beginAtZero: true
              }
            }
          }
        });
      });
    }
  </script>
</body>
</html>
