<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contas - Atelier Débora Freitas</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: 'Playfair Display', serif;
      background-color: #0d2d0e;
      color: #fff;
      text-align: center;
      padding: 2rem;
    }
    h1, h2 {
      color: #c7a17a;
    }
    input, select, button {
      margin: 0.5rem;
      padding: 0.6rem;
      border-radius: 4px;
      border: none;
    }
    select, input {
      width: 220px;
    }
    button {
      background-color: #c7a17a;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #a87b51;
    }
    .voltar {
      margin-top: 2rem;
      display: inline-block;
      padding: 10px 20px;
      background: #c7a17a;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.3s;
    }
    .voltar:hover {
      background: #a87b51;
    }
  </style>
</head>
<body>
  <h1>Contas</h1>

  <section>
    <h2>Cadastro de Conta</h2>
    <input id="descricaoConta" placeholder="Descrição">
    <input type="number" id="valorConta" placeholder="Valor">
    <select id="tipoConta">
      <option value="pagar">A Pagar</option>
      <option value="receber">A Receber</option>
    </select>
    <button onclick="registrarConta()">Registrar</button>
  </section>

  <canvas id="graficoContas"></canvas>

  <a href="home.html" class="voltar">⬅ Voltar ao Menu</a>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDQr7d8DVtzWPPSIAYo1cQg9Swc8IETT3I",
      authDomain: "erp-atelier-debora.firebaseapp.com",
      databaseURL: "https://erp-atelier-debora-default-rtdb.firebaseio.com",
      projectId: "erp-atelier-debora",
      appId: "1:1234567890:web:321abc456def7890"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    auth.onAuthStateChanged(user => {
      if (!user || (user.email !== 'marneysamuellaraujo2@gmail.com' && user.email !== 'linhadeourobydebora@gmail.com')) {
        alert('Acesso restrito. Redirecionando para o início.');
        window.location = 'home.html';
        return;
      }
      carregarGraficoContas();
    });

    function registrarConta() {
      const descricao = document.getElementById('descricaoConta').value;
      const valor = parseFloat(document.getElementById('valorConta').value);
      const tipo = document.getElementById('tipoConta').value;
      if (!descricao || isNaN(valor)) return alert('Preencha!');
      const id = db.ref(`contas/${tipo}`).push().key;
      db.ref(`contas/${tipo}/${id}`).set({ descricao, valor, tipo });
      document.getElementById('descricaoConta').value = '';
      document.getElementById('valorConta').value = '';
      document.getElementById('tipoConta').value = 'pagar';
      carregarGraficoContas();
    }

    function carregarGraficoContas() {
      db.ref('contas').once('value').then(snapshot => {
        let pagar = 0;
        let receber = 0;

        snapshot.forEach(tipo => {
          tipo.forEach(conta => {
            const val = conta.val();
            if (val.tipo === 'pagar') pagar += parseFloat(val.valor);
            if (val.tipo === 'receber') receber += parseFloat(val.valor);
          });
        });

        const ctx = document.getElementById('graficoContas').getContext('2d');
        new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: ['A Pagar', 'A Receber'],
            datasets: [{
              data: [pagar, receber],
              backgroundColor: ['#e74c3c', '#27ae60']
            }]
          }
        });
      });
    }
  </script>
</body>
</html>
